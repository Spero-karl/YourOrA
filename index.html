    <script>
      // Suppress Vite HMR / WebSocket client errors in iframe environment
      window.addEventListener('error', function(event) {
        if (
          event.message && (
            event.message.includes('send') ||
            event.message.includes('WebSocket') ||
            event.message.includes('@vite/client') ||
            event.message.includes('Cannot read properties of undefined')
          )
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason && (
            (event.reason.message && (event.reason.message.includes('send') || event.reason.message.includes('WebSocket'))) ||
            (event.reason.stack && event.reason.stack.includes('@vite/client'))
          )
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
